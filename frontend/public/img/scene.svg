    <linearGradient id="lanternBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d5c"/>
      <stop offset=".45" stop-color="#e8543a"/>
      <stop offset="1" stop-color="#ffab6e"/>
