<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080c1a"/>
      <stop offset=".5" stop-color="#121a31"/>
      <stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="rgba(247,233,180,.95)"/>
      <stop offset=".35" stop-color="rgba(247,233,180,.32)"/>
      <stop offset="1" stop-color="rgba(247,233,180,0)"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10162a"/>
      <stop offset="1" stop-color="#090d1c"/>
